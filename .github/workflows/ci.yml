name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freclean
          POSTGRES_PASSWORD: freclean
          POSTGRES_DB: freclean_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
        env:
          DATABASE_URL: postgres://freclean:freclean@localhost:5432/freclean_test
          JWT_ACCESS_SECRET: test-secret
      - run: npm audit --audit-level=high || true
