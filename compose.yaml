services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: freclean
      POSTGRES_PASSWORD: freclean
      POSTGRES_DB: freclean_dev
    ports:
      - "5432:5432"
    volumes:
      - freclean-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freclean -d freclean_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  freclean-postgres-data: